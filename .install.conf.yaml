- defaults:
    link:
      create: true
      relink: true

- create: ["~/.ssh"]

- clean: ["~", "~/.config", "~/.ssh"]

- link:
    ~/.bashrc_local_after:
    ~/.dotfiles_local: ""
    ~/.git:
    ~/.hammerspoon:
    ~/.name:
    ~/.gnupg/gpg-agent.conf: gpg-agent.conf
    ~/.shell_local_after:
    ~/.shell_local_before:
    ~/.tridactylrc:
    ~/.latexmkrc:
    ~/.ssh/config: ssh/config
    ~/.ssh/config_local: ssh/config_local
    ~/.zshrc_local_after:
    ~/.zshrc_local_before:
    ~/.config/nvim:
    ~/.config/bat/config: bat/config
    ~/.config/bat/themes: bat/themes
    ~/.config/kitty/kitty.conf: kitty.conf
    ~/.aerospace.toml:

- shell:
    - git submodule sync --recursive
    - git update-submodules # after linking ~/.gitconfig
    - ./macos
