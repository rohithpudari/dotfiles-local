[font]
size = 15.0

[font.normal]
family = "Noto Sans Mono"

[window]
decorations = "none"
opacity = 0.9
blur = true

[cursor]
vi_mode_style = "Underline"

[window.dimensions]
columns = 100
lines = 30

[window.padding]
x = 8
y = 5

[selection]
save_to_clipboard = true
semantic_escape_chars = "|:\"' {}()[]<>"

[keyboard]
bindings = [
    { key = "j", mods = "Command", action = "ScrollHalfPageUp"},
    { key = "k", mods = "Command", action = "ScrollHalfPageDown"},
]
